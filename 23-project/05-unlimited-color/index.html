<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Unlimited Color</title>
    <style>
      h2, h1 {
      align-items: center;
      text-align: center;
      font-family: sans-serif;
      font-size: 40px;
      color: black;
    }
    .nav {
      text-decoration: none;
      margin: 50px auto 50px;
      background: #f1f1f1;
      border: solid black 2px;
      width: 2%;
      border-radius: 5px;
      padding: 10px 50px 10px 30px;
      color: black;

    }
    .nav a {
      text-align: center;
      text-decoration: none;
      color: black;
    }
    body {
      width: 300px;
      max-width: 750px;
      min-width: 480px;
      margin: 0 auto;
      background-color: #212121;
    }
    #start, #stop {
      font-size: 20px;
      padding: 10px 20px;
      margin: 10px;
      border-radius: 5px;
      border: none;
      cursor: pointer;
      width: 100%;
      align-items: center;
    }
    p {
      font-size: 16px;
      text-align: center;
    }
    </style>
  </head>
  <body>
    <nav class="nav">
      <a href="/" aria-current="page">Home</a>
    </nav>
    <h1>Start should change the Background color every second</h1>
    <p>Current Color: <span id="color-value">#212121</span></p>
    <button id="start">Start</button>
    <button id="stop">Stop</button>
    <script src="script.js"></script>
  </body>
</html>
